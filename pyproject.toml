[project]
name = "latentwake"
version = "0.0.1"
description = "JEPA surprise detection for maritime vessel tracks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chris Schmidt" }]
dependencies = [
  "torch>=2.4",
  "numpy",
  "polars",
  "duckdb",
  "pyarrow",
  "hydra-core",
  "scikit-learn",
  "zstandard",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "jupyter", "matplotlib"]
tracking = ["wandb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
