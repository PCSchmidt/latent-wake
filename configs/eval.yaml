# Paths used by the Meridian gate checks (scripts/validate-*.sh, run-benchmark.sh).
# One place to change them; the checks read nothing else.
interim: data/interim/chesapeake
processed: data/processed/chesapeake
testset: data/testsets/chesapeake-test-v2
out: reports/eval-v2
contract: DATA_CONTRACT.md

# The combined detector: max of the JEPA's and Kalman's window z-scores, both
# calibrated on validation. Models named jepa or jepa-sN yield fused / fused-sN.
fuse_with_kalman: jepa

# Alert budget: thresholds are set so this share of validation windows would
# alert. The contract gates the test false-alarm rate and detection at it.
alert_fpr: 0.01
calibration: tail   # contract v2.1: per-stratum validation tail probability for every detector

# Models scored by run-benchmark.sh. Name seeds METHOD-sN so the contract
# check averages them (for example jepa-s0, jepa-s1, jepa-s2).
models:
  jepa-s0: runs/jepa-s0/best.pt
  jepa-s1: runs/jepa-s1/best.pt
  jepa-s2: runs/jepa-s2/best.pt
  raw-s0: runs/raw-s0/best.pt
  raw-s1: runs/raw-s1/best.pt
  raw-s2: runs/raw-s2/best.pt
#  jepa-s0: runs/jepa-s0/best.pt
#  raw-s0: runs/raw-s0/best.pt
